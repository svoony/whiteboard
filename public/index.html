<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiteboard</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

<!-- Join overlay -->
<div id="join-overlay">
  <div id="join-box">
    <h1>✏️ Whiteboard</h1>
    <p>Real-time collaborative drawing. Enter your name to join.</p>
    <input id="name-input" type="text" placeholder="Your name…" maxlength="32" autocomplete="off" />
    <button id="join-btn">Join Session</button>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tool-btn active" id="btn-pen" data-tool="pen" title="Pen (P)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
      </svg>
    </button>
    <button class="tool-btn" id="btn-eraser" data-tool="eraser" title="Eraser (E)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20H7L3 16l11-11 7 7-1 8z"/><path d="M6.0 11l6 6"/>
      </svg>
    </button>
    <button class="tool-btn" id="btn-text" data-tool="text" title="Text (T)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>
      </svg>
    </button>

    <div class="tb-sep"></div>

    <div style="position:relative;display:flex;align-items:center;justify-content:center;">
      <button id="color-btn" title="Color" style="background:#1a1a2e;"></button>
      <input id="color-input" type="color" value="#1a1a2e" />
    </div>

    <input id="size-slider" type="range" min="1" max="30" value="4" title="Brush size" />

    <div class="tb-sep"></div>
    <div class="tb-spacer"></div>

    <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 00-4-4H4"/>
      </svg>
    </button>

    <button class="tool-btn" id="btn-clear" title="Clear all">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
      </svg>
    </button>

    <button class="tool-btn" id="btn-share" title="Share / QR Code">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>
  </div>

  <!-- Canvas area -->
  <div id="canvas-wrap">
    <canvas id="main-canvas"></canvas>
    <div id="textbox-layer"></div>
    <div id="cursor-layer"></div>
  </div>
</div>

<!-- Lobby -->
<div id="lobby">
  <div id="online-dot"></div>
  <div id="lobby-avatars"></div>
  <span id="lobby-count">0 online</span>
</div>

<!-- Share modal -->
<div id="share-modal">
  <div id="share-box">
    <h2>Share this board</h2>
    <p>Scan the QR code or share the link</p>
    <img id="qr-img" src="" alt="QR Code" />
    <input id="share-url" type="text" readonly />
    <div class="share-btns">
      <button id="copy-btn">Copy link</button>
      <button id="close-share-btn">Close</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
